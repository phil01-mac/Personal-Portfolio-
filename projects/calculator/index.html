<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Calculator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #0b1120; height: 100vh; display: flex; justify-content: center; align-items: center; }
    .calculator { background: #1e293b; padding: 20px; border-radius: 16px; width: 320px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
    #display { width: 100%; height: 70px; background: #0f172a; color: white; border: none; border-radius: 10px; font-size: 2rem; text-align: right; padding: 10px 15px; margin-bottom: 15px; }
    .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    button { padding: 18px; font-size: 1.2rem; border: none; border-radius: 10px; background: #334155; color: white; cursor: pointer; }
    button:hover { background: #8b5cf6; }
    .equal { background: #be185d; grid-column: span 2; }
    .equal:hover { background: #ec4899; }
    .clear { background: #7f1d1d; }
  </style>
</head>
<body>
  <div class="calculator">
    <input type="text" id="display" disabled>
    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">C</button>
      <button onclick="append('/')">/</button>
      <button onclick="append('*')">*</button>
      <button onclick="append('-')">-</button>
      <button onclick="append('7')">7</button>
      <button onclick="append('8')">8</button>
      <button onclick="append('9')">9</button>
      <button onclick="append('+')">+</button>
      <button onclick="append('4')">4</button>
      <button onclick="append('5')">5</button>
      <button onclick="append('6')">6</button>
      <button onclick="calculate()" class="equal">=</button>
      <button onclick="append('1')">1</button>
      <button onclick="append('2')">2</button>
      <button onclick="append('3')">3</button>
      <button onclick="append('0')">0</button>
    </div>
  </div>
  <script>
    const display = document.getElementById('display');
    function append(value) { display.value += value; }
    function clearDisplay() { display.value = ''; }
    function calculate() {
      try { display.value = eval(display.value); } 
      catch { display.value = 'Error'; }
    }
  </script>
</body>
</html>
