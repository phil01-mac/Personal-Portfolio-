<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #0b1120; color: white; min-height: 100vh; display: flex; justify-content: center; padding-top: 60px; }
    .container { width: 100%; max-width: 450px; background: #1e293b; padding: 25px; border-radius: 16px; }
    h1 { text-align: center; margin-bottom: 20px; color: #a78bfa; }
    .input-section { display: flex; gap: 10px; margin-bottom: 20px; }
    input { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 1rem; }
    button { padding: 12px 18px; background: #8b5cf6; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
    button:hover { background: #7c3aed; }
    ul { list-style: none; }
    li { background: #334155; padding: 12px 15px; margin-bottom: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
    li.completed { text-decoration: line-through; opacity: 0.6; }
    .delete-btn { background: #be185d; padding: 6px 10px; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>My To-Do List</h1>
    <div class="input-section">
      <input type="text" id="taskInput" placeholder="Add a new task...">
      <button onclick="addTask()">Add</button>
    </div>
    <ul id="taskList"></ul>
  </div>
  <script>
    function addTask() {
      const input = document.getElementById('taskInput');
      const taskText = input.value.trim();
      if (taskText === '') return;
      const li = document.createElement('li');
      li.innerHTML = `
        <span onclick="this.parentElement.classList.toggle('completed')">${taskText}</span>
        <button class="delete-btn" onclick="this.parentElement.remove()">Delete</button>
      `;
      document.getElementById('taskList').appendChild(li);
      input.value = '';
    }
    document.getElementById('taskInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') addTask();
    });
  </script>
</body>
</html>
