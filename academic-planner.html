<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academic Planner | Oluwatimilehin's Portfolio</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* Specific styles for the Academic Planner */
    .planner-container {
      max-width: 600px;
      margin: 40px auto;
      background-color: #0A192F; /* Deep Blue */
      border-radius: 10px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      color: white;
    }
    .planner-title {
      text-align: center;
      color: #FFFFFF;
      margin-bottom: 20px;
      border-bottom: 2px solid #800020; /* Burgundy */
      padding-bottom: 10px;
    }
    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .input-group input {
      flex: 1;
      padding: 12px;
      border: 1px solid #800020;
      border-radius: 5px;
      font-size: 16px;
      outline: none;
    }
    .input-group button {
      padding: 12px 20px;
      background-color: #800020; /* Burgundy */
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.3s;
    }
    .input-group button:hover {
      background-color: #a30029;
    }
    .task-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .task-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #112240;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 5px;
      border-left: 4px solid #800020;
      transition: opacity 0.3s;
    }
    .task-text {
      flex: 1;
      cursor: pointer;
      font-size: 16px;
    }
    .task-item.completed .task-text {
      text-decoration: line-through;
      color: #8892b0;
    }
    .delete-btn {
      background-color: transparent;
      color: #ff4d4d;
      border: 1px solid #ff4d4d;
      padding: 5px 10px;
      border-radius: 3px;
      cursor: pointer;
      transition: 0.3s;
    }
    .delete-btn:hover {
      background-color: #ff4d4d;
      color: white;
    }
  </style>
</head>
<body>

  <!-- Navigation (Now includes the Planner link) -->
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo"><span></span></a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="skills.html">Skills</a></li>
        <li><a href="education.html">Education</a></li>
        <li><a href="academic-planner.html">Planner</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
      <button class="menu-toggle" aria-label="Menu">☰</button>
    </div>
  </nav>

  <!-- Planner Section -->
  <section id="planner-section" class="section">
    <div class="container">
      <div class="planner-container">
        <h2 class="planner-title">Academic Task Planner</h2>
        
        <div class="input-group">
          <input type="text" id="taskInput" placeholder="Enter a new academic task...">
          <button id="addTaskBtn">Add Task</button>
        </div>

        <ul class="task-list" id="taskList">
          <!-- Tasks will be injected here by JavaScript -->
        </ul>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p>© 2026 Oluwatimilehin · Computer Science Student at Miva Open University</p>
    </div>
  </footer>

  <script src="script.js"></script>
  
  <!-- Planner JavaScript logic -->
  <script>
    const taskInput = document.getElementById('taskInput');
    const addTaskBtn = document.getElementById('addTaskBtn');
    const taskList = document.getElementById('taskList');

    // Load tasks from local storage or set to an empty array
    let tasks = JSON.parse(localStorage.getItem('academicTasks')) || [];

    // Function to render tasks to the screen
    function renderTasks() {
      taskList.innerHTML = '';
      
      tasks.forEach((task, index) => {
        const li = document.createElement('li');
        li.className = `task-item ${task.completed ? 'completed' : ''}`;
        
        li.innerHTML = `
          <span class="task-text" onclick="toggleTask(${index})">${task.text}</span>
          <button class="delete-btn" onclick="deleteTask(${index})">Delete</button>
        `;
        
        taskList.appendChild(li);
      });
    }

    // Function to add a new task
    function addTask() {
      const taskText = taskInput.value.trim();
      if (taskText !== '') {
        tasks.push({ text: taskText, completed: false });
        localStorage.setItem('academicTasks', JSON.stringify(tasks));
        taskInput.value = '';
        renderTasks();
      }
    }

    // Function to cross out / un-cross out a task
    function toggleTask(index) {
      tasks[index].completed = !tasks[index].completed;
      localStorage.setItem('academicTasks', JSON.stringify(tasks));
      renderTasks();
    }

    // Function to completely delete a task
    function deleteTask(index) {
      tasks.splice(index, 1);
      localStorage.setItem('academicTasks', JSON.stringify(tasks));
      renderTasks();
    }

    // Event listeners
    addTaskBtn.addEventListener('click', addTask);
    taskInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        addTask();
      }
    });

    // Render tasks immediately when the page loads
    renderTasks();
  </script>
</body>
</html>
